
name: Nightly Tests (Windows)


permissions:
  contents: write

on:
  schedule:
    - cron: "*/6 * * * *"  # Runs every 6 minutes
  workflow_dispatch:
  
jobs:
  build:

    env:
      PY_COLORS: "1"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade wheel
        pip install -r requirements.txt
        pip install pyautogui
    - name: Install SeleniumBase
      run: |
        pip install .
    - name: Check the console scripts interface
      run: |
        seleniumbase
        sbase
    - name: Install chromedriver
      run: |
        seleniumbase install chromedriver
    - name: Get chrome-headless-shell
      run: |
        sbase get chs
    - name: Make sure pytest is working
      run: |
        echo "def test_1(): pass" > nothing.py
        pytest nothing.py
    - name: Make sure nosetests is working
      run: |
        echo "def test_2(): pass" > nothing2.py
        nosetests nothing2.py
    - name: Run pytest examples/unit_tests/verify_framework.py --browser=chrome --headless
      run: |
        python js.py --browser=chrome --headed  --maximize -v -s run
    - name: Verify seleniumbase install from PyPI
      run: |
        pip install seleniumbase -U --no-deps --force-reinstall --no-cache-dir
    - name: Commit screenshots to repo
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add screenshots/
        git add output.txt        # ← just add this line
        git diff --staged --quiet || git commit -m "Screenshots - $(date +'%Y-%m-%d %H:%M:%S')"
        git push
